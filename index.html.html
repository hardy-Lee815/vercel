<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강남언니 지역별 시술 트렌드 (내부용)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1f2937;
    --border: #30363d;
    --accent: #f97b5e;
    --accent2: #4ade80;
    --accent3: #60a5fa;
    --text: #e6edf3;
    --text2: #8b949e;
    --badge-bg: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; }
  
  /* TOP BAR */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .topbar .logo { display: flex; align-items: center; gap: 8px; }
  .topbar .logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #fff; }
  .topbar .logo-text { font-size: 15px; font-weight: 700; }
  .topbar .badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px; }
  .topbar .spacer { flex: 1; }
  .topbar .data-range { font-size: 12px; color: var(--text2); }

  /* REGION TABS */
  .region-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 24px; position: sticky; top: 57px; z-index: 99; }
  .region-tab { padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .region-tab:hover { color: var(--text); }
  .region-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PAGE TABS */
  .page-tabs { display: flex; gap: 8px; padding: 16px 24px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .page-tab { padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px; color: var(--text2); background: var(--surface); border: 1px solid var(--border); transition: all 0.15s; }
  .page-tab:hover { color: var(--text); border-color: var(--text2); }
  .page-tab.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  /* CONTENT */
  .content { padding: 20px 24px; }

  /* SUMMARY CARDS */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .summary-card .cat { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .summary-card .insight { font-size: 13px; color: var(--text); line-height: 1.5; }
  .summary-card .insight strong { color: var(--accent); }
  .summary-card .insight .up { color: var(--accent2); }
  .summary-card .insight .down { color: #f87171; }

  /* CHART AREA */
  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .chart-container .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .chart-container .chart-sub { font-size: 12px; color: var(--text2); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 320px; }

  /* PROCEDURE PICKER */
  .picker-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .picker-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .picker-header .title { font-size: 14px; font-weight: 700; }
  .picker-header .hint { font-size: 12px; color: var(--text2); }
  .cat-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cat-btn { padding: 4px 12px; font-size: 12px; font-weight: 600; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--badge-bg); color: var(--text2); transition: all 0.15s; }
  .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .procedure-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; max-height: 280px; overflow-y: auto; }
  .proc-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--badge-bg); font-size: 12px; transition: all 0.15s; }
  .proc-item:hover { border-color: var(--text2); }
  .proc-item.selected { border-color: var(--accent); background: rgba(249,123,94,0.12); color: var(--accent); }
  .proc-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .proc-check { width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .proc-item.selected .proc-check { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* TABLE */
  .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-header .title { font-size: 14px; font-weight: 700; }
  .table-header .subtitle { font-size: 12px; color: var(--text2); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface2); padding: 10px 16px; font-size: 11px; font-weight: 700; color: var(--text2); text-align: left; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  th.right { text-align: right; }
  td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid rgba(48,54,61,0.5); }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--badge-bg); color: var(--text2); }
  .rank-badge.top3 { background: rgba(249,123,94,0.2); color: var(--accent); }
  .wow-up { color: var(--accent2); font-weight: 700; }
  .wow-down { color: #f87171; font-weight: 700; }
  .wow-flat { color: var(--text2); }
  .cat-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; background: var(--badge-bg); color: var(--text2); }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text2); font-size: 14px; gap: 12px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PERIOD FILTER */
  .period-filter { display: flex; gap: 6px; }
  .period-btn { padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--badge-bg); color: var(--text2); transition: all 0.15s; }
  .period-btn.active { background: var(--surface2); color: var(--text); border-color: var(--text2); }

  /* PAGE DISPLAY */
  .page-content { display: none; }
  .page-content.active { display: block; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* SEARCH */
  .search-box { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--badge-bg); color: var(--text); font-size: 13px; width: 200px; outline: none; }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text2); }

  /* CHART LEGEND */
  .custom-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; padding: 3px 8px; border-radius: 6px; border: 1px solid transparent; transition: all 0.15s; }
  .legend-item:hover { background: var(--badge-bg); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  .sortable:hover { opacity: 0.75; }
  .sort-active { text-decoration: underline; }
  .masked-val { color: #666; font-size: 12px; }

  /* 툴팁 */
  .help-icon { display:inline-block; width:15px; height:15px; border-radius:50%; background:var(--text2); color:var(--bg); font-size:10px; font-weight:700; text-align:center; line-height:15px; cursor:pointer; margin-left:6px; position:relative; vertical-align:middle; flex-shrink:0; }
  .help-icon .tooltip-box { display:none; position:absolute; left:20px; top:-4px; background:#2a2d3a; border:1px solid #444; border-radius:8px; padding:10px 13px; font-size:11px; color:#ccc; white-space:nowrap; z-index:999; width:260px; white-space:normal; line-height:1.6; font-weight:400; }
  .help-icon:hover .tooltip-box { display:block; }
  /* 월별 버튼 */
  .period-btn[data-weeks="monthly"] {}
  /* cat-total 항목 */
  .proc-item.cat-total { border:1px dashed; opacity:1; }
  .proc-item.cat-total span { font-style:italic; }
  /* 비중 뱃지 */
  .share-badge { font-size:10px; color:var(--accent2); margin-left:4px; white-space:nowrap; }

</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">언</div>
    <div class="logo-text">강남언니 지역별 시술 트렌드</div>
  </div>
  <div class="badge">내부용</div>
  <div class="spacer"></div>
  <div class="data-range" id="dataRange">데이터 로딩 중...</div>
</div>

<div class="region-tabs" id="regionTabs"></div>
<div class="page-tabs" id="pageTabs">
  <div class="page-tab active" data-page="trend">📈 트렌드 차트</div>
  <div class="page-tab" data-page="top50cum">📊 누적 Top50 WoW</div>
  <div class="page-tab" data-page="top50wow">🔥 최근 WoW Top50</div>
</div>

<div class="content">
  <!-- SHEET 1: TREND -->
  <div class="page-content active" id="page-trend">
    <!-- Summary -->
    <div id="summarySection">
      <div class="loading"><div class="spinner"></div> 데이터 분석 중...</div>
    </div>
    <!-- Period filter -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; margin-top:4px;">
      <div style="font-size:13px; font-weight:700;">시술별 주차/월별 트렌드</div>
      <div class="period-filter" id="periodFilter">
        <div class="period-btn active" data-weeks="12">최근 12주</div>
        <div class="period-btn" data-weeks="26">26주</div>
        <div class="period-btn" data-weeks="52">52주</div>
        <div class="period-btn" data-weeks="0">전체</div>
        <div class="period-btn" data-weeks="monthly">전체(월별)</div>
      </div>
    </div>
    <div class="chart-container">
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
      <div class="custom-legend" id="mainLegend"></div>
    </div>
    <div class="picker-container">
      <div class="picker-header">
        <div class="title">시술 선택 <span style="font-size:12px; color:var(--text2); font-weight:400;">(최대 10개)</span></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <input class="search-box" id="procSearch" placeholder="시술 검색..." oninput="filterProcedures()">
          <div class="hint" id="selectedCount">0/10 선택됨</div>
        </div>
      </div>
      <div class="cat-filter" id="catFilter"></div>
      <div class="procedure-grid" id="procedureGrid"></div>
    </div>
  </div>

  <!-- SHEET 2: TOP50 CUMULATIVE WoW -->
  <div class="page-content" id="page-top50cum">
    <div class="table-container">
      <div class="table-header">
        <div>
          <div class="title">누적 수치 Top 50 시술 — 최근 WoW</div>
          <div class="subtitle" id="cumSubtitle"></div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="cumTable">
          <thead>
            <tr>
              <th style="width:50px;">순위</th>
              <th>시술명</th>
              <th>카테고리</th>
              <th class="right">누적 합계</th>
              <th class="right">전주</th>
              <th class="right">최근주</th>
              <th class="right">WoW</th>
            </tr>
          </thead>
          <tbody id="cumTableBody"><tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- SHEET 3: TOP50 WoW -->
  <div class="page-content" id="page-top50wow">
    <div class="table-container">
      <div class="table-header">
        <div>
          <div class="title">최근 WoW Top 50 시술 (YoY 포함)</div>
          <div class="subtitle" id="wowSubtitle"></div>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="wowTable">
          <thead>
            <tr>
              <th style="width:50px;">순위</th>
              <th>시술명</th>
              <th>카테고리</th>
              <th class="right">전주</th>
              <th class="right">최근주</th>
              <th class="right">WoW</th>
              <th class="right">전년 동기</th>
              <th class="right">YoY</th>
            </tr>
          </thead>
          <tbody id="wowTableBody"><tr><td colspan="8"><div class="loading"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

let DASHBOARD_DATA = null;
let currentRegion = '강남서초';
let currentPage = 'trend';
let selectedProcs = [];
let currentPeriodWeeks = 12;
let activeCat = 'all';
let mainChart = null;

// 색상 팔레트
const COLORS = [
  '#f97b5e','#4ade80','#60a5fa','#f59e0b','#a78bfa',
  '#34d399','#fb7185','#fbbf24','#38bdf8','#e879f9'
];

const CAT_COLORS = {
  '보톡스': '#f97b5e', '필러': '#60a5fa', '지방,다이어트': '#4ade80',
  '리프팅': '#a78bfa', '피부': '#fbbf24', '제모': '#34d399',
  '기타': '#8b949e', '치아': '#38bdf8', '한방': '#fb7185', '모발이식': '#e879f9'
};

async function loadData() {
  try {
    // 전체 base64 데이터 조합 (분할 저장된 경우 합치기)
    const fullB64 = DATA_B64;
    const binary = atob(fullB64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const decompressed = pako.inflate(bytes, { to: 'string' });
    DASHBOARD_DATA = JSON.parse(decompressed);
    init();
  } catch(e) {
    console.error('데이터 로드 실패:', e);
  }
}

function init() {
  const dates = DASHBOARD_DATA.dates;
  document.getElementById('dataRange').textContent = 
    `${dates[0]} ~ ${dates[dates.length-1]}`;
  
  // Region tabs
  const regions = Object.keys(DASHBOARD_DATA.regions);
  const tabsEl = document.getElementById('regionTabs');
  regions.forEach((r, i) => {
    const tab = document.createElement('div');
    tab.className = 'region-tab' + (i === 0 ? ' active' : '');
    tab.textContent = r;
    tab.onclick = () => setRegion(r);
    tabsEl.appendChild(tab);
  });

  // Page tabs
  document.querySelectorAll('.page-tab').forEach(tab => {
    tab.onclick = () => setPage(tab.dataset.page);
  });

  // Period filter
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPeriodWeeks = parseInt(btn.dataset.weeks);
      renderMainChart();
    };
  });

  renderAll();
}

function setRegion(r) {
  currentRegion = r;
  document.querySelectorAll('.region-tab').forEach(t => {
    t.classList.toggle('active', t.textContent === r);
  });
  selectedProcs = [];
  activeCat = 'all';
  renderAll();
}

function setPage(p) {
  currentPage = p;
  document.querySelectorAll('.page-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.page === p);
  });
  document.querySelectorAll('.page-content').forEach(c => {
    c.classList.toggle('active', c.id === 'page-' + p);
  });
  if (p === 'top50cum') renderCumTable();
  if (p === 'top50wow') renderWoWTable();
}

function getItems() {
  return DASHBOARD_DATA.regions[currentRegion] || [];
}

function getDates() { return DASHBOARD_DATA.dates; }

function getRecentActiveIdx(items) {
  const dates = getDates();
  const dateTotals = {};
  items.forEach(item => {
    Object.entries(item[2]).forEach(([idx, val]) => {
      dateTotals[parseInt(idx)] = (dateTotals[parseInt(idx)] || 0) + val;
    });
  });
  const sorted = Object.keys(dateTotals).map(Number).sort((a,b) => b-a);
  return sorted.length ? sorted[0] : dates.length - 1;
}

function fmt(n) {
  if (n == null || isNaN(n)) return '-';
  return n.toLocaleString('ko-KR');
}

function fmtPct(n) {
  if (n == null || isNaN(n)) return '-';
  const sign = n > 0 ? '+' : '';
  return sign + n.toFixed(1) + '%';
}

function wowClass(n) {
  if (n == null || isNaN(n)) return 'wow-flat';
  if (n > 0) return 'wow-up';
  if (n < 0) return 'wow-down';
  return 'wow-flat';
}

// ===================== SHEET 1 =====================
function renderAll() {
  renderSummary();
  renderCatFilter();
  renderProcGrid();
  renderMainChart();
}

function renderSummary() {
  const items = getItems();
  const dates = getDates();
  const recentIdx = getRecentActiveIdx(items);
  const last4Idxs = [recentIdx-3, recentIdx-2, recentIdx-1, recentIdx].filter(i => i >= 0);

  // 카테고리별 최근 4주 합계
  const catSums = {};
  items.forEach(([cat, proc, sparse]) => {
    if (!catSums[cat]) catSums[cat] = { recent4: 0, prev4: 0 };
    last4Idxs.forEach(i => { catSums[cat].recent4 += (sparse[i] || 0); });
    const prev4Idxs = last4Idxs.map(i => i - 4).filter(i => i >= 0);
    prev4Idxs.forEach(i => { catSums[cat].prev4 += (sparse[i] || 0); });
  });

  const dateStr = `${dates[last4Idxs[0]]} ~ ${dates[last4Idxs[last4Idxs.length-1]]}`;
  
  // 카테고리별 Top 시술 찾기
  const catTopProc = {};
  items.forEach(([cat, proc, sparse]) => {
    const sum = last4Idxs.reduce((a, i) => a + (sparse[i] || 0), 0);
    if (!catTopProc[cat] || catTopProc[cat].sum < sum) {
      catTopProc[cat] = { proc, sum };
    }
  });

  // 카테고리 내 비중 계산
  const catAllSum = {};
  items.forEach(([cat, proc, sparse]) => {
    const s = last4Idxs.reduce((a, i) => a + (sparse[i] || 0), 0);
    catAllSum[cat] = (catAllSum[cat] || 0) + s;
  });

  const sortedCats = Object.entries(catSums).sort((a,b) => b[1].recent4 - a[1].recent4);

  let html = `<div style="font-size:12px; color:var(--text2); margin-bottom:8px; display:flex; align-items:center; gap:4px;">
    📊 최근 4주 카테고리별 요약 (${dateStr})
    <span class="help-icon">?<span class="tooltip-box">
      <strong>📌 증감률 기준 안내</strong><br>
      • <b>증감률(%)</b>: 직전 4주 합계 대비 최근 4주 합계의 변화율<br>
      • 예) 최근 4주 100건, 직전 4주 80건 → +25%<br>
      • 최근 4주: 가장 최근 집계 주차 기준 최근 4개 주<br>
      • 직전 4주: 그 이전 4개 주 (5~8주 전)
    </span></span>
  </div>`;
  html += '<div class="summary-grid">';
  
  sortedCats.slice(0, 10).forEach(([cat, {recent4, prev4}]) => {
    const chg = prev4 > 0 ? ((recent4 - prev4) / prev4 * 100) : null;
    const top = catTopProc[cat];
    const chgStr = chg != null 
      ? `<span class="${chg >= 0 ? 'up' : 'down'}">${fmtPct(chg)}</span>` 
      : '';
    const shareVal = (catAllSum[cat] || 0) > 0 ? ((top?.sum || 0) / catAllSum[cat] * 100) : null;
    const shareStr = shareVal != null ? `<span class="share-badge">(카테고리 내 ${shareVal.toFixed(1)}%)</span>` : '';
    html += `<div class="summary-card">
      <div class="cat">${cat}</div>
      <div class="insight">최근 4주 <strong>${fmt(recent4)}</strong>건 ${chgStr}<br>
      주요: ${top?.proc || '-'} ${shareStr}<br>(${fmt(top?.sum || 0)}건)</div>
    </div>`;
  });
  html += '</div>';
  
  document.getElementById('summarySection').innerHTML = html;
}

function renderCatFilter() {
  const items = getItems();
  const cats = [...new Set(items.map(i => i[0]))].sort();
  const el = document.getElementById('catFilter');
  el.innerHTML = '<div class="cat-btn active" data-cat="all" onclick="setCat(\'all\')">전체</div>';
  cats.forEach(cat => {
    el.innerHTML += `<div class="cat-btn" data-cat="${cat}" onclick="setCat('${cat}')">${cat}</div>`;
  });
}

function setCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  renderProcGrid();
}

function filterProcedures() { renderProcGrid(); }

function renderProcGrid() {
  const items = getItems();
  const dates = getDates();
  const recentIdx = getRecentActiveIdx(items);
  const search = document.getElementById('procSearch').value.toLowerCase();
  
  let filtered = items.filter(([cat]) => activeCat === 'all' || cat === activeCat);
  if (search) filtered = filtered.filter(([,proc]) => proc.toLowerCase().includes(search));
  
  // 누적 합계 기준 정렬
  filtered.sort((a, b) => {
    const sa = Object.values(a[2]).reduce((x,y)=>x+y,0);
    const sb = Object.values(b[2]).reduce((x,y)=>x+y,0);
    return sb - sa;
  });

  const grid = document.getElementById('procedureGrid');
  grid.innerHTML = '';

  // 카테고리 전체 항목 (특정 카테고리 선택 시만 표시)
  if (activeCat !== 'all') {
    const catKey = '__CAT__' + activeCat;
    const isSelected = selectedProcs.includes(catKey);
    const isDisabled = !isSelected && selectedProcs.length >= 10;
    const div = document.createElement('div');
    div.className = `proc-item cat-total ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}`;
    div.innerHTML = `<div class="proc-check">${isSelected ? '✓' : ''}</div><span>📊 ${activeCat} 전체</span>`;
    if (!isDisabled) div.onclick = () => toggleProc(catKey);
    grid.appendChild(div);
  }

  filtered.slice(0, 200).forEach(([cat, proc, sparse]) => {
    const isSelected = selectedProcs.includes(proc);
    const isDisabled = !isSelected && selectedProcs.length >= 10;
    const div = document.createElement('div');
    div.className = `proc-item ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}`;
    div.innerHTML = `<div class="proc-check">${isSelected ? '✓' : ''}</div><span>${proc}</span>`;
    if (!isDisabled) {
      div.onclick = () => toggleProc(proc);
    }
    grid.appendChild(div);
  });
  
  document.getElementById('selectedCount').textContent = `${selectedProcs.length}/10 선택됨`;
}

function toggleProc(proc) {
  const idx = selectedProcs.indexOf(proc);
  if (idx >= 0) {
    selectedProcs.splice(idx, 1);
  } else if (selectedProcs.length < 10) {
    selectedProcs.push(proc);
  }
  renderProcGrid();
  renderMainChart();
}

function getMonthlyAgg(items, procKeys) {
  // 주차 데이터를 월별로 집계
  const allDates = getDates();
  const monthMap = {}; // 'YYYY-MM' -> index list
  allDates.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (!monthMap[m]) monthMap[m] = [];
    monthMap[m].push(i);
  });
  const months = Object.keys(monthMap).sort();
  // procKeys별 월별 합계
  const result = {};
  procKeys.forEach(procKey => {
    result[procKey] = months.map(m => {
      const idxs = monthMap[m];
      if (procKey.startsWith('__CAT__')) {
        const cat = procKey.slice(7);
        return items.filter(it => it[0] === cat).reduce((sum, it) => {
          return sum + idxs.reduce((s, i) => s + (it[2][i] || 0), 0);
        }, 0);
      } else {
        const it = items.find(i => i[1] === procKey);
        return it ? idxs.reduce((s, i) => s + (it[2][i] || 0), 0) : 0;
      }
    });
  });
  return { months, result };
}

function renderMainChart() {
  const items = getItems();
  const allDates = getDates();
  const recentIdx = getRecentActiveIdx(items);

  // 선택된 시술이 없으면 Top5 사용
  let procs = selectedProcs;
  if (procs.length === 0) {
    const sorted = [...items].sort((a, b) => {
      const sa = Object.values(a[2]).reduce((x,y)=>x+y,0);
      const sb = Object.values(b[2]).reduce((x,y)=>x+y,0);
      return sb - sa;
    });
    procs = sorted.slice(0, 5).map(i => i[1]);
  }

  let labels, datasets;

  if (currentPeriodWeeks === 'monthly') {
    // 월별 집계
    const { months, result } = getMonthlyAgg(items, procs);
    labels = months;
    datasets = procs.map((procKey, ci) => {
      const label = procKey.startsWith('__CAT__') ? '📊 ' + procKey.slice(7) + ' 전체' : procKey;
      return {
        label,
        data: result[procKey] || [],
        borderColor: COLORS[ci % COLORS.length],
        backgroundColor: COLORS[ci % COLORS.length] + '20',
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        tension: 0.3,
        fill: false
      };
    });
  } else {
    // 주차별 집계
    let startIdx = 0;
    if (currentPeriodWeeks > 0) {
      startIdx = Math.max(0, recentIdx - currentPeriodWeeks + 1);
    }
    const displayDates = allDates.slice(startIdx, recentIdx + 1);
    const displayIdxs = Array.from({length: displayDates.length}, (_, i) => startIdx + i);
    labels = displayDates.map(d => d.slice(5));
    datasets = procs.map((procKey, ci) => {
      const label = procKey.startsWith('__CAT__') ? '📊 ' + procKey.slice(7) + ' 전체' : procKey;
      let data;
      if (procKey.startsWith('__CAT__')) {
        const cat = procKey.slice(7);
        data = displayIdxs.map(i =>
          items.filter(it => it[0] === cat).reduce((s, it) => s + (it[2][i] || 0), 0)
        );
      } else {
        const item = items.find(i => i[1] === procKey);
        data = displayIdxs.map(i => item ? (item[2][i] || 0) : 0);
      }
      return {
        label,
        data,
        borderColor: COLORS[ci % COLORS.length],
        backgroundColor: COLORS[ci % COLORS.length] + '20',
        borderWidth: 2,
        pointRadius: displayDates.length > 26 ? 0 : 3,
        pointHoverRadius: 5,
        tension: 0.3,
        fill: false
      };
    });
  }

  if (mainChart) mainChart.destroy();
  const ctx = document.getElementById('mainChart').getContext('2d');
  mainChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#8b949e',
          bodyColor: '#e6edf3',
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => ` ${item.dataset.label}: ${fmt(item.raw)}건`
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', font: { size: 11 }, maxTicksLimit: 12 }
        },
        y: {
          grid: { color: '#21262d' },
          ticks: { color: '#8b949e', font: { size: 11 },
            callback: v => v.toLocaleString('ko-KR')
          }
        }
      }
    }
  });

  // Custom legend
  const legendEl = document.getElementById('mainLegend');
  legendEl.innerHTML = datasets.map((ds, i) => `
    <div class="legend-item" onclick="toggleDataset(${i})">
      <div class="legend-dot" style="background:${ds.borderColor}"></div>
      <span>${ds.label}</span>
    </div>`).join('');
}

function toggleDataset(idx) {
  if (!mainChart) return;
  const meta = mainChart.getDatasetMeta(idx);
  meta.hidden = !meta.hidden;
  mainChart.update();
}

// ===================== SHEET 2 =====================
function renderCumTable() {
  const items = getItems();
  const dates = getDates();
  const recentIdx = getRecentActiveIdx(items);
  const prevIdx = recentIdx - 1;

  document.getElementById('cumSubtitle').textContent = 
    `기준: 전주=${dates[prevIdx]}, 최근주=${dates[recentIdx]}`;

  const rows = items.map(([cat, proc, sparse]) => {
    const total = Object.values(sparse).reduce((a,b)=>a+b,0);
    const cur = sparse[recentIdx] || 0;
    const prev = sparse[prevIdx] || 0;
    const wow = prev > 0 ? ((cur-prev)/prev*100) : (cur > 0 ? 100 : null);
    return { cat, proc, total, cur, prev, wow };
  }).sort((a,b) => b.total - a.total).slice(0, 50);

  const tbody = document.getElementById('cumTableBody');
  tbody.innerHTML = rows.map((r, i) => {
    const rank = i + 1;
    const wowStr = r.wow != null ? fmtPct(r.wow) : '-';
    const cls = r.wow != null ? wowClass(r.wow) : 'wow-flat';
    return `<tr>
      <td><span class="rank-badge ${rank <= 3 ? 'top3' : ''}">${rank}</span></td>
      <td>${r.proc}</td>
      <td><span class="cat-tag">${r.cat}</span></td>
      <td class="right">${fmt(r.total)}</td>
      <td class="right">${fmt(r.prev)}</td>
      <td class="right">${fmt(r.cur)}</td>
      <td class="right ${cls}">${wowStr}</td>
    </tr>`;
  }).join('');
}

// ===================== SHEET 3 =====================
let wowSortCol = 'wow';
let wowSortDir = -1; // -1 내림차순, 1 오름차순

function renderWoWTable() {
  const items = getItems();
  const dates = getDates();
  const recentIdx = getRecentActiveIdx(items);
  const prevIdx = recentIdx - 1;
  const yoyIdx = recentIdx - 52;

  document.getElementById('wowSubtitle').textContent = 
    `기준: 최근주=${dates[recentIdx]}, 전년동기=${yoyIdx >= 0 ? dates[yoyIdx] : 'N/A'}`;

  let rows = items.map(([cat, proc, sparse]) => {
    const cur = sparse[recentIdx] || 0;
    const prev = sparse[prevIdx] || 0;
    if (cur < 10 || prev < 10) return null; // 전주/최근주 모두 10 이상
    const wow = prev > 0 ? ((cur-prev)/prev*100) : (cur > 0 ? 100 : null);
    const yoyCur = yoyIdx >= 0 ? (sparse[yoyIdx] || 0) : null;
    let yoy = null;
    if (yoyCur != null && yoyCur > 0) {
      yoy = ((cur - yoyCur) / yoyCur * 100);
    } else if (yoyCur === 0 && cur > 0) {
      yoy = 100;
    }
    return { cat, proc, cur, prev, wow, yoyCur, yoy };
  }).filter(r => r != null && r.wow != null);

  // 정렬
  rows.sort((a, b) => {
    let av = a[wowSortCol], bv = b[wowSortCol];
    if (av == null) av = -Infinity;
    if (bv == null) bv = -Infinity;
    if (typeof av === 'string') return wowSortDir * av.localeCompare(bv);
    return wowSortDir * (bv - av);
  });
  rows = rows.slice(0, 50);

  // 헤더 렌더
  const thead = document.querySelector('#wowTable thead tr');
  thead.innerHTML = ['#','시술명','카테고리','전주','최근주','WoW','전년 동기','YoY'].map((h, i) => {
    const cols = [null,'proc','cat','prev','cur','wow','yoyCur','yoy'];
    const col = cols[i];
    if (!col) return `<th style="width:50px;">${h}</th>`;
    const isActive = wowSortCol === col;
    const arrow = isActive ? (wowSortDir === -1 ? ' ▼' : ' ▲') : ' ⇅';
    return `<th class="right sortable${isActive?' sort-active':''}" onclick="setWowSort('${col}')">${h}${arrow}</th>`;
  }).join('');

  const tbody = document.getElementById('wowTableBody');
  tbody.innerHTML = rows.map((r, i) => {
    const rank = i + 1;
    const wowStr = r.wow != null ? fmtPct(r.wow) : '-';
    const wCls = r.wow != null ? wowClass(r.wow) : 'wow-flat';
    const yoyStr = r.yoy != null ? fmtPct(r.yoy) : '-';
    const yCls = r.yoy != null ? wowClass(r.yoy) : 'wow-flat';
    return `<tr>
      <td><span class="rank-badge ${rank <= 3 ? 'top3' : ''}">${rank}</span></td>
      <td>${r.proc}</td>
      <td><span class="cat-tag">${r.cat}</span></td>
      <td class="right">${fmt(r.prev)}</td>
      <td class="right">${fmt(r.cur)}</td>
      <td class="right ${wCls}">${wowStr}</td>
      <td class="right">${r.yoyCur != null ? fmt(r.yoyCur) : '-'}</td>
      <td class="right ${yCls}">${yoyStr}</td>
    </tr>`;
  }).join('');
}

function setWowSort(col) {
  if (wowSortCol === col) { wowSortDir *= -1; }
  else { wowSortCol = col; wowSortDir = -1; }
  renderWoWTable();
}

// Start
loadData();
